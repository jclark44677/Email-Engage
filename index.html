<!DOCTYPE html>
<html>
<head>
    <title>Engage Email Preview</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Removed hover-img and show-hover styles since they are no longer needed */
    </style>
</head>
<body>

    <div class="email-container">
        <img src="Email-engage.png" class="base-img" usemap="#button-map">
        
        <map name="button-map">
            <!-- 
                Changed shape to "circle". 
                Coords format for circle is "x, y, radius". 
                (Adjust these numbers to fit your specific button location)
            -->
            <area shape="circle" 
                  coords="422,1010,84" 
                  href="https://www.linkedin.com/in/jill-clark-26b956384/" 
                  alt="LinkedIn Profile">
        </map>
    </div>

</body>
</html>
