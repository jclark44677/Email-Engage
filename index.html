<!DOCTYPE html>
<html>
<head>
    <title>Banter Email Preview</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Overlay for the animation frames */
        .animation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the hitbox */
        }

        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            opacity: 0; /* Hidden by default */
        }

        /* Animation Trigger: When hovering the container, play the frames in sequence */
        .email-container:hover .frame-1 { animation: flash 0.6s step-end 0s; }
        .email-container:hover .frame-2 { animation: flash 0.6s step-end 0.2s; }
        .email-container:hover .frame-3 { animation: flash 0.6s step-end 0.4s; }

        @keyframes flash {
            0% { opacity: 1; }
            33% { opacity: 1; } /* Keeps it visible for its duration */
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="email-container">
        <!-- Main Image -->
        <img src="Engage-email.png" class="base-img" usemap="#button-map">
        
        <!-- Animation Frames -->
        <div class="animation-overlay">
            <img src="Button 1.png" class="frame frame-1">
            <img src="Button 2.png" class="frame frame-2">
            <img src="Button 3.png" class="frame frame-3">
        </div>

        <map name="button-map">
            <!-- Perfect Circle Hitbox -->
            <area shape="circle" 
                  coords="438, 1007, 68" 
                  href="https://linkedin.com" 
                  alt="LinkedIn Profile">
        </map>
    </div>

</body>
</html>
