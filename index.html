<!DOCTYPE html>
<html>
<head>
    <title>Engage Email Preview</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            opacity: 0; /* Change to 1 to see if they are loading at all */
            pointer-events: none;
            z-index: 10; /* Force them to the very front */
        }

        /* Animation Keyframes */
        @keyframes sequence {
            0% { opacity: 0; }
            1% { opacity: 1; }
            33% { opacity: 1; }
            34% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Trigger classes */
        .play-1 { animation: sequence 0.6s step-end 0s; }
        .play-2 { animation: sequence 0.6s step-end 0.2s; }
        .play-3 { animation: sequence 0.6s step-end 0.4s; }
    </style>
</head>
<body>

    <div class="email-container">
        <img src="Email-engage.png" class="base-img" usemap="#button-map">
        
        <!-- Animated Frames -->
        <img src="Button 1.png" id="b1" class="frame">
        <img src="Button 2.png" id="b2" class="frame">
        <img src="Button 3.png" id="b3" class="frame">

        <map name="button-map">
            <area shape="circle" 
                  coords="438, 1007, 68" 
                  href="https://linkedin.com" 
                  onmouseover="startAnim()" 
                  onmouseout="stopAnim()">
        </map>
    </div>

    <script>
        function startAnim() {
            // Check the console (F12) to see if this triggers
            console.log("Hovering over hitbox!"); 
            document.getElementById('b1').classList.add('play-1');
            document.getElementById('b2').classList.add('play-2');
            document.getElementById('b3').classList.add('play-3');
        }

        function stopAnim() {
            document.getElementById('b1').classList.remove('play-1');
            document.getElementById('b2').classList.remove('play-2');
            document.getElementById('b3').classList.remove('play-3');
        }
    </script>

</body>
</html>
