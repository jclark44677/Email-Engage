<!DOCTYPE html>
<html>
<head>
    <title>Engage Email Preview</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            opacity: 0; 
            pointer-events: none;
            z-index: 10;
        }

        /* Animation for Frame 1 & 2 (Flash on then off) */
        @keyframes sequence {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Animation for Frame 3 (Flash on and STAY on) */
        @keyframes hold {
            0% { opacity: 1; }
            100% { opacity: 1; }
        }

        /* Faster timing: 0.1s steps */
        .play-1 { animation: sequence 0.1s step-end 0s; }
        .play-2 { animation: sequence 0.1s step-end 0.1s; }
        .play-3 { animation: hold 0.1s step-end 0.2s forwards; } /* 'forwards' keeps it visible */
    </style>
</head>
<body>

    <div class="email-container">
        <img src="Email-engage.png" class="base-img" usemap="#button-map">
        
        <img src="Engage Button 1.png" id="b1" class="frame">
        <img src="Engage Button 2.png" id="b2" class="frame">
        <img src="Engage Button 3.png" id="b3" class="frame">

        <map name="button-map">
            <area shape="circle" 
                  coords="438, 1007, 68" 
                  href="https://www.linkedin.com/in/jill-clark-26b956384/" 
                  onmouseover="startAnim()" 
                  onmouseout="stopAnim()">
        </map>
    </div>

    <script>
        function startAnim() {
            document.getElementById('b1').classList.add('play-1');
            document.getElementById('b2').classList.add('play-2');
            document.getElementById('b3').classList.add('play-3');
        }

        function stopAnim() {
            document.getElementById('b1').classList.remove('play-1');
            document.getElementById('b2').classList.remove('play-2');
            document.getElementById('b3').classList.remove('play-3');
        }
    </script>

</body>
</html>
