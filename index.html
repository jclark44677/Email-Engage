<!DOCTYPE html>
<html>
<head>
    <style>
        /* Centers the image on your screen */
        body { display: flex; justify-content: center; margin: 0; padding-top: 50px; background: #f4f4f4; }

        .email-container {
            position: relative;
            width: 600px; /* This is your display width */
            line-height: 0;
        }

        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hitbox {
            position: absolute;
            /* Math: (844 / 1200) */
            left: 70.33%; 
            /* Math: (2020 / 3000) */
            top: 67.33%;  
            /* Math: (Radius 168 * 2) / 1200 */
            width: 28%;   
            aspect-ratio: 1 / 1;
            
            /* Ensures the center of this circle sits on the coordinate */
            transform: translate(-50%, -50%);
            border-radius: 50%;
            
            /* Visual debugging - delete the background color once it's aligned */
            background: rgba(255, 0, 0, 0.4); 
            border: 2px solid red;
        }
    </style>
</head>
<body>

    <div class="email-container">
        <img src="Email-engage.png" class="base-img">
        
        <!-- The Clickable Hitbox -->
        <a href="https://linkedin.com" class="hitbox"></a>
    </div>

</body>
</html>
