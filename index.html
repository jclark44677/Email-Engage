<!DOCTYPE html>
<html>
<head>
    <title>Engage Email Preview</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Removed hover-img and show-hover styles since they are no longer needed */
    </style>
</head>
<body>

    <div class="email-container">
        <img src="Email-engage.png" class="base-img" usemap="#button-map">
        
<map name="button-map">
    <!-- 
        Square shape (using 'rect' with equal sides)
        Coords: top-left x, top-left y, bottom-right x, bottom-right y
    -->
    <area shape="rect" 
          coords="370,947,506,1067" 
          href="https://linkedin.com" 
          alt="LinkedIn Profile">
</map>
    </div>

</body>
</html>
