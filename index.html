<!DOCTYPE html>
<html>
<head>
    <title>Engage Email Preview</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
            z-index: 1; /* Ensures it stays visible */
        }

        .animation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Sits on top of base-img */
            pointer-events: none; 
        }

        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            opacity: 0;
        }

        /* Logic: Hovering the container triggers the individual frames */
        .email-container:hover .frame-1 { animation: flash 0.6s step-end 0s; }
        .email-container:hover .frame-2 { animation: flash 0.6s step-end 0.2s; }
        .email-container:hover .frame-3 { animation: flash 0.6s step-end 0.4s; }

        @keyframes flash {
            0%, 100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="email-container">
        <!-- Make sure this file is in the SAME folder as this HTML file -->
        <img src="Email-engage.png" class="base-img" usemap="#button-map">
        
        <div class="animation-overlay">
            <img src="Button 1.png" class="frame frame-1">
            <img src="Button 2.png" class="frame frame-2">
            <img src="Button 3.png" class="frame frame-3">
        </div>

        <map name="button-map">
            <area shape="circle" 
                  coords="438, 1007, 68" 
                  href="https://linkedin.com" 
                  alt="LinkedIn Profile">
        </map>
    </div>

</body>
</html>
