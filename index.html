<!DOCTYPE html>
<html>
<head>
    <title>Engage Email - Animated Sequence</title>
    <style>
        body { background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; margin: 0; }

        .email-container {
            position: relative;
            width: 600px; 
        }
        
        .base-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .button-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: block;
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.1s; 
        }

        .color-on {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div class="email-container">
        <img src="Email-engage.png" class="base-img" usemap="#button-map">
        
        <img src="Engage Button 1.png" id="frame1" class="button-frame">
        <img src="Engage Button 2.png" id="frame2" class="button-frame">
        <img src="Engage Button 3.png" id="frame3" class="button-frame">
        
        <map name="button-map">
            <!-- Use the ORIGINAL full-size coordinates here -->
            <area shape="circle" 
                  coords="844,2020,168" 
                  href="https://linkedin.com" 
                  onmouseover="startLights()" 
                  onmouseout="stopLights()">
        </map>
    </div>

    <!-- Image Map Resizer Script -->
    <script src="https://cloudflare.com"></script>

    <script>
        // Initialize the resizer
        imageMapResize();

        let timers = [];

        function startLights() {
            timers.forEach(t => clearTimeout(t));
            timers = [];
            
            timers.push(setTimeout(() => { document.getElementById('frame1').classList.add('color-on'); }, 0));
            timers.push(setTimeout(() => { document.getElementById('frame2').classList.add('color-on'); }, 80));
            timers.push(setTimeout(() => { document.getElementById('frame3').classList.add('color-on'); }, 160));
        }

        function stopLights() {
            timers.forEach(t => clearTimeout(t));
            timers = [];
            document.getElementById('frame1').classList.remove('color-on');
            document.getElementById('frame2').classList.remove('color-on');
            document.getElementById('frame3').classList.remove('color-on');
        }
    </script>
</body>
</html>
